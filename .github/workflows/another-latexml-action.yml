name: Build and Check HTML

on:
  workflow_dispatch:
  push:
    paths:
      - '**.tex'

permissions:
  contents: write

jobs:
  html_build_and_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # STEP 1: Generate HTML5 (LaTeXML)
      # ----------------------------------------------------------------
      - name: Generate HTML
        # We use the specialized ar5ivist image
        # Note: We mount the current directory ($PWD) to /source inside the container
        run: |
          docker run --rm -v "${PWD}:/source" -w /source \
          latexml/ar5ivist:latest \
          latexmlc \
            --dest=html_output/index.html \
            --format=html5 \
            --pmml \
            --mathtex \
            --css=https://ar5iv.labs.arxiv.org/assets/ar5iv.css \
            main.tex
      # ----------------------------------------------------------------
      # STEP 3: Commit Artifacts
      # ----------------------------------------------------------------
      - name: Commit HTML and Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add the entire output folder and the report
          git add -f html_output/
          
          if ! git diff --quiet --cached; then
            git commit -m "Build: Update arXiv-style HTML"
            git push
          else
            echo "No changes to commit."
          fi
